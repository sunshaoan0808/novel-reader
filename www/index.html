<button id="asst_fab" type="button" title="浮生小助手" aria-label="浮生小助手"></button>
<script>document.getElementById("asst_fab").innerHTML = icon("lightbulb",22);</script>
<script>
/* 小助手悬浮球：可拖动，点按打开；位置记忆 */
(function(){
  var fab = document.getElementById("asst_fab");
  if(!fab) return;
  /* 恢复上次位置（避开顶栏区） */
  try{
    var pos = JSON.parse(localStorage.getItem("nd_asst_fab_pos") || "null");
    if(pos && typeof pos.x === "number" && typeof pos.y === "number"){
      var cy = Math.max(220, Math.min(window.innerHeight - 48, pos.y));
      fab.style.left = pos.x + "px"; fab.style.top = cy + "px";
      fab.style.right = "auto"; fab.style.bottom = "auto";
    }
  }catch(e){}
  var sx, sy, ox, oy, moved, pid;
  function clamp(v, lo, hi){ return Math.max(lo, Math.min(hi, v)); }
  function onStart(e){
    var t = e.touches ? e.touches[0] : e;
    pid = e.pointerId;
    sx = t.clientX; sy = t.clientY;
    var r = fab.getBoundingClientRect();
    ox = r.left; oy = r.top;
    moved = false;
    fab.classList.add("dragging");
    fab.style.left = ox + "px"; fab.style.top = oy + "px";
    fab.style.right = "auto"; fab.style.bottom = "auto";
    if(fab.setPointerCapture && pid !== undefined){ try{ fab.setPointerCapture(pid); }catch(_){} }
    e.preventDefault();
  }
  function onMove(e){
    if(sx === undefined) return;
    var t = e.touches ? e.touches[0] : e;
    var dx = t.clientX - sx, dy = t.clientY - sy;
    if(Math.abs(dx) + Math.abs(dy) > 8) moved = true;
    if(!moved) return;
    var nx = clamp(ox + dx, 0, window.innerWidth - 48);
    /* 避开顶栏区（chathead+ctxbar+wsbar 约 220px），不遮挡内容 */
    var ny = clamp(oy + dy, 220, window.innerHeight - 48);
    fab.style.left = nx + "px"; fab.style.top = ny + "px";
    e.preventDefault();
  }
  function onEnd(e){
    if(sx === undefined) return;
    fab.classList.remove("dragging");
    if(!moved){
      /* 点按：打开小助手 */
      if(typeof openAssistant === "function") openAssistant();
    }else{
      /* 拖拽结束：记忆位置 */
      try{
        var r = fab.getBoundingClientRect();
        localStorage.setItem("nd_asst_fab_pos", JSON.stringify({x: Math.round(r.left), y: Math.round(r.top)}));
      }catch(_){}
    }
    sx = undefined;
  }
  fab.addEventListener("pointerdown", onStart);
  fab.addEventListener("pointermove", onMove);
  fab.addEventListener("pointerup", onEnd);
  fab.addEventListener("pointercancel", onEnd);

  /* P0-2/P1-32 内容避让：
     1) 球被拖过（或上次就存过位置）就标 .pinned，此后一律交给 inline left/top，
        CSS 里的按页摆位规则不再插手 —— 用户的摆放说了算；
     2) 没 pin 时滚动就淡出让位，停手 700ms 再回来。悬浮球天生要盖在内容上，
        滚动时收起是唯一既不挡内容又不牺牲可点的办法。 */
  try{
    var saved = JSON.parse(localStorage.getItem("nd_asst_fab_pos") || "null");
    if(saved && typeof saved.x === "number" && typeof saved.y === "number") fab.classList.add("pinned");
  }catch(e){}
  var awayTimer = null;
  window.addEventListener("scroll", function(){
    if(fab.classList.contains("pinned")) return;
    fab.classList.add("away");
    clearTimeout(awayTimer);
    awayTimer = setTimeout(function(){ fab.classList.remove("away"); }, 700);
  }, {passive:true});
})();
</script>
